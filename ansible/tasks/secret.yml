# One Secret from `item` (see `secrets` in cluster.yml). Values are logged
# only with -e show_secrets=true, so --diff stays safe to paste by default.
- name: "secret {{ item.namespace | default(ns) }}/{{ item.name }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ item.namespace | default(ns) }}"
      data: "{{ secret_data }}"
  vars:
    # Kept free of stray whitespace so Ansible turns the result back into a dict.
    secret_data: >-
      {%- set d = {} -%}
      {%- for k, v in (item.env | default({})).items() -%}{%- set _ = d.update({k: senv[v] | b64encode}) -%}{%- endfor -%}
      {%- for k, v in (item.optional_env | default({})).items() if v in senv -%}{%- set _ = d.update({k: senv[v] | b64encode}) -%}{%- endfor -%}
      {%- for k, f in (item.files | default({})).items() -%}{%- set _ = d.update({k: lookup('file', secrets_dir ~ '/' ~ f, rstrip=false) | b64encode}) -%}{%- endfor -%}
      {{ d }}
  no_log: "{{ not show_secrets | bool }}"
  register: secret_result

- name: "queue restarts for {{ item.name }}"
  ansible.builtin.set_fact:
    restart_queue: "{{ restart_queue | default([]) + item.restarts | default([]) }}"
  when: secret_result is changed
