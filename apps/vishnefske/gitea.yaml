# Gitea (git2.${SITE_HOST}). app.ini is generated from GITEA__* env on start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gitea }
  template:
    metadata:
      labels: { app: gitea }
    spec:
      nodeSelector: { kubernetes.io/hostname: wyse }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gitea
          image: vishnefske/gitea
          imagePullPolicy: Never
          env:
            - { name: GITEA__default__RUN_USER, value: app }
            - { name: GITEA__default__APP_NAME, value: Gitea }
            - { name: GITEA__database__DB_TYPE, value: postgres }
            - { name: GITEA__database__HOST, value: "postgres:5432" }
            - name: GITEA__database__NAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: GITEA_DB_NAME } }
            - name: GITEA__database__USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: GITEA_DB_USER } }
            - name: GITEA__database__PASSWD
              valueFrom: { secretKeyRef: { name: db-credentials, key: GITEA_DB_PASSWORD } }
            - { name: GITEA__server__DOMAIN, value: "git2.${SITE_HOST}" }
            - { name: GITEA__server__ROOT_URL, value: "https://git2.${SITE_HOST}/" }
            - { name: GITEA__server__HTTP_PORT, value: "3000" }
            - { name: GITEA__server__DISABLE_SSH, value: "true" }
            - { name: GITEA__server__START_SSH_SERVER, value: "false" }
            - { name: GITEA__repository__ROOT, value: /data/git/repositories }
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            # Accounts only via the Keycloak login source.
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "false" }
            - { name: GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION, value: "true" }
            - { name: GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION, value: "true" }
            - { name: GITEA__oauth2_client__ACCOUNT_LINKING, value: login }
            - { name: GITEA__log__MODE, value: console }
          # GITEA__security__SECRET_KEY, GITEA__security__INTERNAL_TOKEN,
          # GITEA__oauth2__JWT_SECRET
          envFrom:
            - secretRef: { name: gitea }
          ports: [{ name: http, containerPort: 3000 }]
          startupProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gitea-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
spec:
  selector: { app: gitea }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["git2.${SITE_HOST}"]
      secretName: gitea-tls
  rules:
    - host: "git2.${SITE_HOST}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: gitea, port: { name: http } } }
