# JFrog Container Registry (Artifactory JCR) at hub.${SITE_HOST}: Docker, Helm
# and generic repositories. Upstream chart and images (pulled from
# releases-docker.jfrog.io / Docker Hub on first use).
#
# - Secrets: no secrets.env. The artifactory-secrets Job below generates the
#   `artifactory` Secret once (random admin password, master/join keys, DB
#   password) and never overwrites it. View the admin password with
#   `just artifactory-password`.
# - Database: the shared PostgreSQL. The same Job then connects to it over the
#   Service as the superuser (from db-credentials) and creates the
#   `artifactory` role and database (idempotent). If postgres's volume is ever
#   wiped, rerun it: `just artifactory-db`. The Job's ServiceAccount can only
#   read and create Secrets: no exec, no pod access.
# - Admin login: the chart writes bootstrap.creds from the Secret, so the
#   default admin/password never exists on the public URL. Access applies it on
#   start, so the Secret stays the source of truth for the admin password.
# - No chart nginx: Traefik terminates TLS and routes / to the router (8082)
#   and /artifactory/ to Tomcat (8081). Docker uses the repository-path method:
#   docker login hub.${SITE_HOST}; docker pull hub.${SITE_HOST}/<repo>/<image>.
# - First start: log in as admin and set the Base URL to
#   https://hub.${SITE_HOST} (Administration -> General -> Settings).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifactory-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: artifactory-secrets
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [artifactory]
    verbs: [get]
  # create can't be limited by name; the script only ever creates `artifactory`.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: artifactory-secrets
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: artifactory-secrets }
subjects: [{ kind: ServiceAccount, name: artifactory-secrets }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: artifactory-secrets
  annotations:
    # Shell variables below, not Flux ${VARS}.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  # initContainer: create the Secret once, never overwrite it.
  secret.sh: |
    set -euo pipefail
    if kubectl get secret artifactory >/dev/null 2>&1; then
      echo "Secret artifactory exists"; exit 0
    fi
    pw=$(openssl rand -hex 16)
    kubectl create secret generic artifactory \
      --from-literal=master-key="$(openssl rand -hex 32)" \
      --from-literal=join-key="$(openssl rand -hex 16)" \
      --from-literal=admin-password="$pw" \
      --from-literal=bootstrap-creds="admin@*=$pw" \
      --from-literal=db-user=artifactory \
      --from-literal=db-password="$(openssl rand -hex 24)" \
      --from-literal=db-url=jdbc:postgresql://postgres:5432/artifactory
    echo "created Secret artifactory"
  # Same reconcile as postgres's own entrypoint; the password is read with
  # \getenv, so it never appears in SQL text or argv.
  db.sh: |
    set -eu
    until pg_isready -q; do echo "waiting for postgres"; sleep 5; done
    psql -q -v ON_ERROR_STOP=1 -d postgres <<'SQL'
    \getenv pw DB_PASSWORD
    SELECT 'CREATE ROLE artifactory LOGIN'
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'artifactory')\gexec
    SELECT format('ALTER ROLE artifactory WITH LOGIN PASSWORD %L', :'pw')\gexec
    SELECT 'CREATE DATABASE artifactory OWNER artifactory'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'artifactory')\gexec
    SQL
    echo "database artifactory ready"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: artifactory-secrets
  annotations:
    # Jobs are immutable; let Flux replace it when the spec changes.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: artifactory-secrets
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: secret
          image: docker.io/alpine/k8s:1.35.10@sha256:6b9b607247ab8f0d0bd2d6173a0b842b4d173c652475c9a715eec0c7ef27eac5
          imagePullPolicy: IfNotPresent
          command: [bash, /scripts/secret.sh]
          env:
            - { name: HOME, value: /tmp }
          volumeMounts: &mounts
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext: &csc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: &res
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: db
          image: docker.io/library/postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
          imagePullPolicy: IfNotPresent
          command: [sh, /scripts/db.sh]
          env:
            - { name: HOME, value: /tmp }
            - { name: PGHOST, value: postgres }
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_USER } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: artifactory, key: db-password } }
          volumeMounts: *mounts
          securityContext: *csc
          resources: *res
      volumes:
        - name: scripts
          configMap: { name: artifactory-secrets }
        - name: tmp
          emptyDir: {}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jfrog
spec:
  interval: 24h
  url: https://charts.jfrog.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: artifactory
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: artifactory-jcr
      version: 107.161.26
      sourceRef:
        kind: HelmRepository
        name: jfrog
  values:
    artifactory:
      postgresql:
        enabled: false
      database:
        type: postgresql
        driver: org.postgresql.Driver
        secrets:
          url: { name: artifactory, key: db-url }
          user: { name: artifactory, key: db-user }
          password: { name: artifactory, key: db-password }
      nginx:
        enabled: false
      ingress:
        enabled: true
        className: traefik
        # A defaultBackend would make this Ingress Traefik's catch-all for every host.
        defaultBackend: { enabled: false }
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        hosts: ["hub.${SITE_HOST}"]
        tls:
          - hosts: ["hub.${SITE_HOST}"]
            secretName: artifactory-tls
      artifactory:
        masterKeySecretName: artifactory
        joinKeySecretName: artifactory
        admin:
          secret: artifactory
          dataKey: bootstrap-creds
        # The Wyse has ~7.5 GiB and is already ~80% used; keep the heap small.
        nodeSelector: { kubernetes.io/hostname: wyse }
        persistence:
          size: 20Gi
        javaOpts:
          xms: 512m
          xmx: 1536m
        resources:
          requests: { cpu: 200m, memory: 1Gi }
          limits: { memory: 2560Mi }
      # The chart runs the UI and the event bus as separate Deployments; keep
      # them off the 2 GB APU2 too.
      frontend:
        nodeSelector: { kubernetes.io/hostname: wyse }
      jfbus:
        nodeSelector: { kubernetes.io/hostname: wyse }
