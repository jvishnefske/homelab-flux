apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vishnefske
resources:
  - namespace.yaml
  - site.yaml
  - rust.yaml
  - pomodoro.yaml
  - postgres.yaml
  - keycloak.yaml
  - gitea.yaml
  - gerrit.yaml
  - nats.yaml
  - pubsub.yaml
  - admin.yaml
  - monitoring.yaml
  - artifactory.yaml
# Grafana's provisioned dashboards. Names are fixed (no hash suffix) so the
# Grafana Deployment can mount them by name.
configMapGenerator:
  - name: grafana-dashboards
    files: [grafana/pubsub.json]
generatorOptions:
  disableNameSuffixHash: true
# Nix-built images, preloaded on the nodes (imagePullPolicy: Never).
# newTag = git rev of the vishnefske.com repo; bumped by deploy-site.sh.
images:
  - { name: vishnefske/site, newTag: "8684979" }
  - { name: vishnefske/pomodoro, newTag: "8684979" }
  - { name: vishnefske/postgres, newTag: "8684979" }
  - { name: vishnefske/keycloak, newTag: "8684979" }
  - { name: vishnefske/gitea, newTag: "8684979" }
  - { name: vishnefske/gerrit, newTag: "8684979" }
  - { name: vishnefske/nats, newTag: "8684979" }
  - { name: vishnefske/admin, newTag: "8684979" }
